name: CI

on:
  push:
    branches: [main]
  pull_request:

# Satu run per branch — commit baru membatalkan run lama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Selaras dengan Postgres production (Neon PG16+); pgvector tidak dibutuhkan unit test.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kelaswfa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kelaswfa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kelaswfa
      TOKEN_SECRET: ci-token-secret-0123456789abcdef0123456789abcdef
      IP_HASH_SALT: ci-ip-hash-salt
      CRON_SECRET: ci-cron-secret
      MOCK_EMAILIT: "true"
      MOCK_R2: "true"
      ADMIN_EMAIL: kelaswfa@gmail.com
      ADMIN_PASSWORD: ci-admin-password
      PUBLIC_SITE_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      - name: Lint & format (Biome)
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

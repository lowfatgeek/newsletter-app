<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Desain Baru Email KelasWFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-canvas: #FFFCF5;
      --color-surface-subtle: #F7F1E6;
      --color-surface-raised: #FFFFFF;
      --color-ink: #153B35;
      --color-text: #36514B;
      --color-text-muted: #6C7E79;
      --color-border: #E7DED0;
      --color-primary: #176B5B;
      --color-primary-hover: #105447;
      --color-primary-subtle: #E5F2EE;
      --color-gold: #D99020;
      --color-gold-subtle: #FFF2D6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #EDE8DE;
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Bar */
    .top-bar {
      background: #FFFFFF;
      border-bottom: 1px solid var(--color-border);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(21, 59, 53, 0.04);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: var(--color-ink);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: 0.02em;
    }

    .preview-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-ink);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--color-surface-subtle);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
    }

    .btn-tab {
      background: transparent;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-tab.active {
      background: #FFFFFF;
      color: var(--color-primary);
      box-shadow: 0 1px 3px rgba(21, 59, 53, 0.08);
    }

    .device-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--color-surface-subtle);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
    }

    .btn-device {
      background: transparent;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      color: var(--color-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-device.active {
      background: #FFFFFF;
      color: var(--color-ink);
      box-shadow: 0 1px 3px rgba(21, 59, 53, 0.08);
    }

    /* Preview Canvas */
    .preview-wrapper {
      flex: 1;
      padding: 32px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
    }

    .preview-container {
      width: 100%;
      max-width: 640px;
      transition: max-width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .preview-container.mobile {
      max-width: 375px;
    }

    .email-outer-frame {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(21, 59, 53, 0.12);
      border: 1px solid rgba(21, 59, 53, 0.08);
      overflow: hidden;
    }

    .client-header {
      background: #F4F1EA;
      border-bottom: 1px solid var(--color-border);
      padding: 12px 16px;
      font-size: 12px;
      color: var(--color-text-muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .client-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .client-label {
      font-weight: 600;
      width: 50px;
      color: var(--color-text);
    }

    .client-val {
      color: var(--color-ink);
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #237A55;
      font-weight: 600;
      font-size: 11px;
      background: #E8F6EE;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
    }

    /* Email View Area */
    .email-render-viewport {
      background-color: #FFFCF5;
      padding: 32px 20px;
    }

    @media (max-width: 600px) {
      .email-render-viewport {
        padding: 20px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Top bar controls -->
  <div class="top-bar">
    <div class="top-bar-left">
      <span class="logo-badge">KelasWFA</span>
      <span class="preview-title">Email Template Redesign Preview</span>
    </div>

    <!-- Template Selector -->
    <div class="controls-group">
      <button class="btn-tab active" onclick="switchTemplate('confirm-id')">Konfirmasi (ID)</button>
      <button class="btn-tab" onclick="switchTemplate('confirm-en')">Confirm (EN)</button>
      <button class="btn-tab" onclick="switchTemplate('access-id')">Akses Kado (ID)</button>
      <button class="btn-tab" onclick="switchTemplate('access-en')">Reward Access (EN)</button>
    </div>

    <!-- Device Viewport Toggle -->
    <div class="device-group">
      <button class="btn-device active" id="btn-desktop" onclick="setDevice('desktop')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Desktop
      </button>
      <button class="btn-device" id="btn-mobile" onclick="setDevice('mobile')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
        Mobile
      </button>
    </div>
  </div>

  <!-- Preview Area -->
  <div class="preview-wrapper">
    <div class="preview-container" id="preview-box">
      <div class="email-outer-frame">
        <!-- Mock Email Client Bar -->
        <div class="client-header">
          <div class="client-row">
            <span class="client-label">Dari:</span>
            <span class="client-val"><strong>KelasWFA</strong> &lt;hi@kelaswfa.my.id&gt;</span>
            <span class="security-badge">&#10003; SPF & DKIM Valid (No Hidden Image Warning)</span>
          </div>
          <div class="client-row">
            <span class="client-label">Subjek:</span>
            <span class="client-val" id="mock-subject">Konfirmasi email untuk membuka hadiah KelasWFA</span>
          </div>
        </div>

        <!-- Render Viewport -->
        <div class="email-render-viewport" id="email-content">
          <!-- Dynamic Content rendered by JS -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const templates = {
      'confirm-id': {
        subject: 'Konfirmasi email untuk membuka hadiah KelasWFA',
        badge: 'KADO DARI KELASWFA',
        title: 'Satu langkah lagi menuju hadiahmu',
        body: '<p style="margin:0; font-size:16px; line-height:1.65; color:#36514B;">Klik tombol di bawah untuk mengonfirmasi emailmu dan membuka hadiah dari KelasWFA.</p>',
        voucherTitle: 'Paket Kado Digital Siap Dibuka',
        voucherSub: 'Tautan terenkripsi &middot; Berlaku 7 hari',
        cta: 'Konfirmasi Email & Buka Hadiah &rarr;',
        url: 'https://kelaswfa.my.id/konfirmasi/tok_94f8a201bce471d8',
        fallbackLabel: 'Tombol di atas tidak bisa diklik? Salin tautan berikut ke browsermu:',
        closing: 'Semoga bermanfaat untuk langkah dan kemandirian kerjamu,',
        sender: 'Tim KelasWFA',
        replyNote: 'Butuh bantuan? Cukup balas email ini (hi@kelaswfa.my.id)',
        privacyNote: 'Email ini dikirim atas permintaan kado di KelasWFA. Kami tidak pernah membagikan emailmu kepada pihak mana pun.'
      },
      'confirm-en': {
        subject: 'Confirm your email to open your KelasWFA gift',
        badge: 'GIFT FROM KELASWFA',
        title: 'One last step to open your gift',
        body: '<p style="margin:0; font-size:16px; line-height:1.65; color:#36514B;">Tap the button below to confirm your email and access your download right away.</p>',
        voucherTitle: 'Digital Gift Package Ready',
        voucherSub: 'Encrypted token &middot; Valid for 7 days',
        cta: 'Confirm Email & Unlock Gift &rarr;',
        url: 'https://kelaswfa.my.id/en/konfirmasi/tok_94f8a201bce471d8',
        fallbackLabel: 'Button not working? Copy and paste this URL into your browser:',
        closing: 'Wishing you all the best in your remote work journey,',
        sender: 'The KelasWFA Team',
        replyNote: 'Need help? Just reply to this email (hi@kelaswfa.my.id)',
        privacyNote: 'This email was sent in response to your gift request on KelasWFA. We respect your privacy.'
      },
      'access-id': {
        subject: 'Hadiah KelasWFA-mu: Starter Kit Kerja Remote 2026',
        badge: 'AKSES KADO DIBUKA',
        title: 'Kadomu sudah siap diunduh! 🎁',
        body: '<p style="margin:0 0 16px 0; font-size:16px; line-height:1.65; color:#36514B;">Selamat! Emailmu sudah terkonfirmasi. Paket kado <strong>Starter Kit Kerja Remote 2026</strong> sudah siap untuk kamu unduh sekarang.</p>',
        voucherTitle: 'Starter Kit Kerja Remote 2026',
        voucherSub: 'Akses halaman berlaku 7 hari &middot; Link file 1 jam',
        cta: 'Buka Halaman Unduhan &rarr;',
        url: 'https://kelaswfa.my.id/akses/tok_83bc99d123e4',
        fallbackLabel: 'Jika tombol tidak berfungsi, buka tautan unduhan berikut:',
        closing: 'Selamat berkarya dan semoga berkah,',
        sender: 'Tim KelasWFA',
        replyNote: 'Pertanyaan atau masalah unduhan? Balas email ini langsung (hi@kelaswfa.my.id).',
        privacyNote: 'Tautan unduhan ini bersifat pribadi untuk alamat emailmu. Jangan teruskan email ini kepada orang lain.'
      },
      'access-en': {
        subject: 'Your KelasWFA gift: Remote Work Starter Kit 2026',
        badge: 'GIFT ACCESS UNLOCKED',
        title: 'Your gift is ready to download! 🎁',
        body: '<p style="margin:0 0 16px 0; font-size:16px; line-height:1.65; color:#36514B;">Congratulations! Your email has been verified. Your reward <strong>Remote Work Starter Kit 2026</strong> is ready for download.</p>',
        voucherTitle: 'Remote Work Starter Kit 2026',
        voucherSub: 'Page access valid 7 days &middot; Download link 1 hour',
        cta: 'Open Download Page &rarr;',
        url: 'https://kelaswfa.my.id/en/akses/tok_83bc99d123e4',
        fallbackLabel: 'If the button does not work, open this direct download link:',
        closing: 'Rooting for your remote career freedom,',
        sender: 'The KelasWFA Team',
        replyNote: 'Questions or issues with your file? Reply directly to this email (hi@kelaswfa.my.id).',
        privacyNote: 'This download link is unique to your email address. Do not forward this email.'
      }
    };

    function renderEmail(key) {
      const data = templates[key];
      document.getElementById('mock-subject').textContent = data.subject;

      const html = `
<!-- EMAIL CLIENT CONTAINER (Max 560px) -->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px; margin:0 auto; font-family:'Plus Jakarta Sans', Arial, Helvetica, sans-serif;">
  <tr>
    <td style="padding:0;">
      
      <!-- MAIN CARD CONTAINER -->
      <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background:#FFFFFF; border:1px solid #E7DED0; border-radius:20px; overflow:hidden; box-shadow:0 4px 20px rgba(21, 59, 53, 0.04);">
        
        <!-- TOP BRAND ACCENT BAR -->
        <tr>
          <td style="height:6px; background:#176B5B; font-size:0; line-height:0;">&nbsp;</td>
        </tr>

        <!-- CARD BODY -->
        <tr>
          <td style="padding:36px 32px 32px 32px;">
            
            <!-- BRAND OVERLINE TAG -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin-bottom:18px;">
              <tr>
                <td style="background:#E5F2EE; color:#176B5B; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:5px 12px; border-radius:999px;">
                  ${data.badge}
                </td>
              </tr>
            </table>

            <!-- MAIN HEADING -->
            <h1 style="color:#153B35; font-size:24px; font-weight:700; line-height:1.25; letter-spacing:-0.025em; margin:0 0 16px 0;">
              ${data.title}
            </h1>

            <!-- BODY CONTENT -->
            <div style="font-size:16px; line-height:1.65; color:#36514B; margin-bottom:24px;">
              ${data.body}
            </div>

            <!-- VOUCHER / GIFT TICKET CALLOUT -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background:#F7F1E6; border:1px solid #E7DED0; border-radius:14px; margin-bottom:28px;">
              <tr>
                <td style="padding:16px 20px;">
                  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                    <tr>
                      <td style="vertical-align:middle;">
                        <div style="font-size:14px; font-weight:700; color:#153B35; margin-bottom:3px;">
                          ${data.voucherTitle}
                        </div>
                        <div style="font-size:12px; color:#6C7E79; font-weight:500;">
                          ${data.voucherSub}
                        </div>
                      </td>
                      <td align="right" style="vertical-align:middle; width:40px;">
                        <div style="font-size:24px; line-height:1;">🎁</div>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- CTA BUTTON -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom:24px;">
              <tr>
                <td>
                  <a href="${data.url}" target="_blank" style="display:inline-block; background:#176B5B; color:#FFFFFF; text-decoration:none; font-size:16px; font-weight:700; padding:14px 28px; border-radius:12px; line-height:1; letter-spacing:-0.01em; box-shadow:0 3px 8px rgba(23, 107, 91, 0.25);">
                    ${data.cta}
                  </a>
                </td>
              </tr>
            </table>

            <!-- FALLBACK LINK BOX -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background:#FFFCF5; border:1px solid #E7DED0; border-radius:10px; margin-bottom:32px;">
              <tr>
                <td style="padding:12px 14px;">
                  <div style="font-size:11px; font-weight:600; color:#6C7E79; margin-bottom:4px;">
                    ${data.fallbackLabel}
                  </div>
                  <div style="font-size:12px; color:#176B5B; word-break:break-all; line-height:1.4;">
                    <a href="${data.url}" style="color:#176B5B; text-decoration:underline;">${data.url}</a>
                  </div>
                </td>
              </tr>
            </table>

            <!-- DIVIDER -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom:24px;">
              <tr>
                <td style="height:1px; background:#E7DED0; font-size:0; line-height:0;">&nbsp;</td>
              </tr>
            </table>

            <!-- SIGN-OFF -->
            <div style="font-size:14px; color:#36514B; line-height:1.6; margin-bottom:4px;">
              ${data.closing}
            </div>
            <div style="font-size:14px; font-weight:700; color:#153B35;">
              ${data.sender}
            </div>

          </td>
        </tr>

        <!-- CARD FOOTER (Grey tone) -->
        <tr>
          <td style="background:#FAF8F5; border-top:1px solid #E7DED0; padding:20px 32px;">
            <p style="margin:0 0 6px 0; font-size:12px; color:#6C7E79; line-height:1.5;">
              ${data.replyNote}
            </p>
            <p style="margin:0; font-size:11px; color:#95A4A0; line-height:1.5;">
              ${data.privacyNote}
            </p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
      `;

      document.getElementById('email-content').innerHTML = html;
    }

    function switchTemplate(key) {
      document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderEmail(key);
    }

    function setDevice(device) {
      document.querySelectorAll('.btn-device').forEach(b => b.classList.remove('active'));
      const box = document.getElementById('preview-box');
      if (device === 'mobile') {
        document.getElementById('btn-mobile').classList.add('active');
        box.classList.add('mobile');
      } else {
        document.getElementById('btn-desktop').classList.add('active');
        box.classList.remove('mobile');
      }
    }

    // Initialize with Indonesian Confirmation
    renderEmail('confirm-id');
  </script>
</body>
</html>

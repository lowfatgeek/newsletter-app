<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Redesign Halaman Unduhan (Download Desk) — KelasWFA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-canvas: #FFFCF5;
      --color-surface-subtle: #F7F1E6;
      --color-surface-raised: #FFFFFF;
      --color-ink: #153B35;
      --color-text: #36514B;
      --color-text-muted: #566662;
      --color-border: #E7DED0;
      --color-primary: #176B5B;
      --color-primary-hover: #105447;
      --color-primary-subtle: #E5F2EE;
      --color-gold: #D99020;
      --color-gold-subtle: #FFF2D6;
      --color-warning: #9A6514;
      --color-warning-subtle: #FFF4DC;
      --color-success: #237A55;
      --color-success-subtle: #E8F6EE;
      --color-info: #24709A;
      --color-info-subtle: #E6F3FA;

      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --radius-control: 12px;
      --radius-card: 20px;
      --radius-pill: 999px;
      --border-default: 1px solid var(--color-border);
      --shadow-card: 0 1px 2px rgba(21, 59, 53, 0.04), 0 8px 24px rgba(21, 59, 53, 0.05);
      --shadow-hover: 0 8px 28px rgba(21, 59, 53, 0.08);
      --shadow-float: 0 16px 40px rgba(21, 59, 53, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: #E7E2D6;
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Studio Controller */
    .studio-bar {
      background: #FFFFFF;
      border-bottom: 1px solid var(--color-border);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(21, 59, 53, 0.04);
    }

    .studio-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-pill {
      background: var(--color-ink);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: 0.02em;
    }

    .studio-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-ink);
    }

    .scenario-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--color-surface-subtle);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: #FFFFFF;
      color: var(--color-primary);
      box-shadow: 0 1px 3px rgba(21, 59, 53, 0.08);
    }

    .device-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--color-surface-subtle);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--color-border);
    }

    .device-btn {
      background: transparent;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      color: var(--color-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .device-btn.active {
      background: #FFFFFF;
      color: var(--color-ink);
      box-shadow: 0 1px 3px rgba(21, 59, 53, 0.08);
    }

    /* Workspace Canvas */
    .preview-canvas {
      flex: 1;
      padding: 32px 16px 64px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
    }

    /* Simulated Browser / Device Frame */
    .device-frame {
      width: 100%;
      max-width: 960px;
      background: var(--color-canvas);
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(21, 59, 53, 0.14);
      border: 1px solid rgba(21, 59, 53, 0.08);
      overflow: hidden;
      transition: max-width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .device-frame.mobile {
      max-width: 390px; /* iPhone / Modern Smartphone width */
      border-radius: 36px;
      border: 8px solid #2C3531;
    }

    /* Simulated Browser Bar */
    .browser-bar {
      background: #F4EFE6;
      border-bottom: 1px solid var(--color-border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--color-text-muted);
    }

    .browser-dots {
      display: flex;
      gap: 6px;
    }

    .browser-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #D9CFC1;
    }

    .browser-url {
      flex: 1;
      background: #FFFFFF;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      font-family: monospace;
      font-size: 11px;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Mobile Notch Simulation */
    .mobile-notch {
      display: none;
      background: #2C3531;
      height: 24px;
      width: 140px;
      margin: 0 auto;
      border-radius: 0 0 14px 14px;
    }

    .device-frame.mobile .mobile-notch {
      display: block;
    }

    .device-frame.mobile .browser-bar {
      display: none; /* Hide desktop browser bar on mobile simulation */
    }

    /* ========================================================
       THE REDESIGNED DOWNLOAD PAGE STYLES
       ======================================================== */
    .download-page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--color-canvas);
    }

    /* Header Bar */
    .desk-header {
      height: 68px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(255, 252, 245, 0.85);
      backdrop-filter: blur(8px);
    }

    .desk-logo {
      font-weight: 800;
      font-size: 18px;
      color: var(--color-ink);
      text-decoration: none;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .desk-logo-badge {
      font-size: 11px;
      font-weight: 700;
      background: var(--color-surface-subtle);
      border: 1px solid var(--color-border);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      color: var(--color-text-muted);
    }

    .header-security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-success);
      background: var(--color-success-subtle);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(35, 122, 85, 0.2);
    }

    /* Main Container */
    .desk-main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 44px 20px 60px;
      flex: 1;
    }

    @media (max-width: 640px) {
      .desk-main {
        padding: 28px 16px 48px;
      }
    }

    /* Hero Header */
    .desk-hero {
      text-align: center;
      margin-bottom: 36px;
    }

    .celebration-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-primary-subtle);
      color: var(--color-primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      margin-bottom: 16px;
    }

    .desk-hero h1 {
      font-size: clamp(28px, 4.5vw, 36px);
      font-weight: 800;
      color: var(--color-ink);
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    .desk-hero p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--color-text-muted);
      max-width: 520px;
      margin: 0 auto 18px;
    }

    /* Expiry & Session Callout Pill */
    .session-expiry-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--color-warning-subtle);
      border: 1px solid rgba(154, 101, 20, 0.25);
      padding: 7px 16px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-warning);
    }

    /* Asset Grid & Card Styling */
    .asset-list {
      list-style: none;
      display: grid;
      gap: 16px;
      margin-bottom: 32px;
    }

    .asset-card {
      background: var(--color-surface-raised);
      border: var(--border-default);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .asset-card:hover {
      box-shadow: var(--shadow-hover);
      border-color: #D6CABA;
    }

    /* Top Ribbon Accent */
    .asset-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-gold) 100%);
    }

    /* Desktop Layout (Default) */
    .asset-card-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .asset-meta-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    /* File Icon Avatar */
    .file-icon-box {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: var(--color-surface-subtle);
      border: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .file-icon-box.zip {
      background: #FFF2D6;
      border-color: #EED7AA;
      color: #B57715;
    }

    .file-icon-box.pdf {
      background: #FCECEE;
      border-color: #F4C7CD;
      color: #B53C4A;
    }

    .file-icon-box.sheet {
      background: #E8F6EE;
      border-color: #C0E8D0;
      color: #237A55;
    }

    .file-icon-ext {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 2px;
      line-height: 1;
    }

    .asset-details {
      flex: 1;
      min-width: 0;
    }

    .asset-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-ink);
      line-height: 1.35;
      margin-bottom: 6px;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .asset-submeta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .meta-tag {
      background: var(--color-surface-subtle);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .security-check-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--color-success);
      font-weight: 500;
    }

    /* Download Action Button */
    .btn-download-action {
      background: var(--color-primary);
      color: #FFFFFF;
      text-decoration: none;
      padding: 13px 24px;
      border-radius: var(--radius-control);
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      min-height: 48px;
      box-shadow: 0 4px 12px rgba(23, 107, 91, 0.2);
    }

    .btn-download-action:hover {
      background: var(--color-primary-hover);
      box-shadow: 0 6px 16px rgba(23, 107, 91, 0.3);
      transform: translateY(-1px);
    }

    .btn-download-action:active {
      transform: translateY(1px);
    }

    .btn-download-action.downloading {
      background: #105447;
      pointer-events: none;
      opacity: 0.9;
    }

    .btn-download-action.success {
      background: #237A55;
    }

    /* ========================================================
       MOBILE CARD ADAPTATION (< 640px & .device-frame.mobile)
       ======================================================== */
    @media (max-width: 640px) {
      .desk-header {
        height: 56px;
        padding: 0 16px;
      }
      .desk-logo {
        font-size: 16px;
      }
      .header-security-badge {
        font-size: 11px;
        padding: 4px 8px;
      }
      .desk-main {
        padding: 24px 16px 40px;
      }
      .desk-hero {
        margin-bottom: 24px;
      }
      .celebration-pill {
        font-size: 11px;
        padding: 5px 12px;
        margin-bottom: 12px;
      }
      .desk-hero h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      .desk-hero p {
        font-size: 14px;
        margin-bottom: 14px;
      }
      .session-expiry-pill {
        font-size: 12px;
        padding: 6px 12px;
      }
      .asset-card {
        padding: 18px 16px;
      }
      .asset-card-inner {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 16px !important;
      }
      .asset-meta-group {
        align-items: flex-start !important;
        width: 100% !important;
        gap: 14px !important;
      }
      .file-icon-box {
        width: 44px !important;
        height: 44px !important;
      }
      .asset-details {
        flex: 1 !important;
        min-width: 0 !important;
        width: calc(100% - 58px) !important;
      }
      .asset-title {
        font-size: 15px !important;
        word-break: normal !important;
        overflow-wrap: break-word !important;
      }
      .asset-submeta {
        font-size: 12px !important;
      }
      .btn-download-action {
        width: 100% !important;
        display: flex !important;
        justify-content: center !important;
        padding: 14px 16px !important;
        font-size: 14px !important;
        white-space: normal !important;
        text-align: center !important;
      }
      .guide-card {
        padding: 18px 16px !important;
      }
      .guide-title {
        font-size: 13px !important;
      }
      .guide-step {
        font-size: 12px !important;
      }
      .support-bar {
        flex-direction: column !important;
        align-items: flex-start !important;
        padding: 14px 16px !important;
        gap: 6px !important;
      }
    }

    /* Scoped specifically for Studio frame when .mobile is toggled on desktop browsers */
    .device-frame.mobile .desk-header {
      height: 56px;
      padding: 0 16px;
    }
    .device-frame.mobile .desk-logo {
      font-size: 16px;
    }
    .device-frame.mobile .header-security-badge {
      font-size: 11px;
      padding: 4px 8px;
    }
    .device-frame.mobile .desk-main {
      padding: 24px 16px 40px;
    }
    .device-frame.mobile .desk-hero {
      margin-bottom: 24px;
    }
    .device-frame.mobile .celebration-pill {
      font-size: 11px;
      padding: 5px 12px;
      margin-bottom: 12px;
    }
    .device-frame.mobile .desk-hero h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .device-frame.mobile .desk-hero p {
      font-size: 14px;
      margin-bottom: 14px;
    }
    .device-frame.mobile .session-expiry-pill {
      font-size: 12px;
      padding: 6px 12px;
    }
    .device-frame.mobile .asset-card {
      padding: 18px 16px;
    }
    .device-frame.mobile .asset-card-inner {
      flex-direction: column !important;
      align-items: stretch !important;
      gap: 16px !important;
    }
    .device-frame.mobile .asset-meta-group {
      align-items: flex-start !important;
      width: 100% !important;
      gap: 14px !important;
    }
    .device-frame.mobile .file-icon-box {
      width: 44px !important;
      height: 44px !important;
    }
    .device-frame.mobile .asset-details {
      flex: 1 !important;
      min-width: 0 !important;
      width: calc(100% - 58px) !important;
    }
    .device-frame.mobile .asset-title {
      font-size: 15px !important;
      word-break: normal !important;
      overflow-wrap: break-word !important;
    }
    .device-frame.mobile .asset-submeta {
      font-size: 12px !important;
    }
    .device-frame.mobile .btn-download-action {
      width: 100% !important;
      display: flex !important;
      justify-content: center !important;
      padding: 14px 16px !important;
      font-size: 14px !important;
      white-space: normal !important;
      text-align: center !important;
    }
    .device-frame.mobile .guide-card {
      padding: 18px 16px !important;
    }
    .device-frame.mobile .guide-title {
      font-size: 13px !important;
    }
    .device-frame.mobile .guide-step {
      font-size: 12px !important;
    }
    .device-frame.mobile .support-bar {
      flex-direction: column !important;
      align-items: flex-start !important;
      padding: 14px 16px !important;
      gap: 6px !important;
    }

    /* Quick Guide Card (Panduan Membuka Kado) */
    .guide-card {
      background: var(--color-surface-subtle);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .guide-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .guide-steps {
      display: grid;
      gap: 14px;
    }

    .guide-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--color-text);
    }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 1px solid var(--color-border);
      font-size: 11px;
      font-weight: 700;
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Support & Help Card */
    .support-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .support-bar a {
      color: var(--color-primary);
      font-weight: 600;
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .support-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }

    /* Empty State Card */
    .empty-state-card {
      background: #FFFFFF;
      border: var(--border-default);
      border-radius: var(--radius-card);
      padding: 40px 24px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }

    .empty-icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--color-warning-subtle);
      color: var(--color-warning);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .empty-state-card h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-ink);
      margin-bottom: 8px;
    }

    .empty-state-card p {
      font-size: 14px;
      color: var(--color-text-muted);
      line-height: 1.6;
      max-width: 440px;
      margin: 0 auto 20px;
    }
  </style>
</head>
<body>

  <!-- Top Studio Control Bar -->
  <div class="studio-bar">
    <div class="studio-brand">
      <span class="brand-pill">KelasWFA</span>
      <span class="studio-title">Download Page Redesign Studio</span>
    </div>

    <!-- Scenario Selector -->
    <div class="scenario-tabs">
      <button class="tab-btn active" onclick="switchScenario('single-zip')">1 Berkas (Kasus User: ZIP)</button>
      <button class="tab-btn" onclick="switchScenario('multi-bundle')">Multi-Berkas (Bundle 3 File)</button>
      <button class="tab-btn" onclick="switchScenario('empty-state')">Berkas Belum Tersedia</button>
      <button class="tab-btn" onclick="switchScenario('english-locale')">English Version (EN)</button>
    </div>

    <!-- Device Switcher -->
    <div class="device-switcher">
      <button class="device-btn active" id="btn-desktop" onclick="setDevice('desktop')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Desktop (720px)

    function switchScenario(key) {

    }

    function setDevice(device) {
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      const frame = document.getElementById('device-frame');
      if (device === 'mobile') {
        document.getElementById('btn-mobile').classList.add('active');
        frame.classList.add('mobile');
      } else {
        document.getElementById('btn-desktop').classList.add('active');

      }
    }

    function simulateDownload(id, originalText) {
      const btn = document.getElementById('btn-' + id);
      const label = btn.querySelector('.btn-label');
      
      btn.classList.add('downloading');
      label.textContent = 'Menyiapkan berkas...';

      setTimeout(() => {
        label.textContent = 'Mengunduh... (80%)';
      }, 700);

      setTimeout(() => {
        btn.classList.remove('downloading');
        btn.classList.add('success');
        label.textContent = '✓ Unduhan Selesai!';

        setTimeout(() => {
          btn.classList.remove('success');
          label.textContent = originalText;
        }, 2500);
      }, 1600);
